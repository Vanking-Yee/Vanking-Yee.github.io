  <script>
    (function() {
      // 等待页面加载完成
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

      function init() {
        var nav = document.getElementById('navbar');
        if (!nav) return;

        var navLinks = document.querySelectorAll('#navbar .navbar-nav a');
        var brandStrong = document.querySelector('#navbar .navbar-brand strong');

        function updateNavbar() {
          if (window.scrollY > 50) {
            nav.style.background = '#2c3e6b';
            nav.style.boxShadow = '0 2px 12px rgba(0,0,0,0.2)';
            if (brandStrong) brandStrong.style.color = '#ffffff';
            navLinks.forEach(function(el) {
              el.style.color = '#ffffff';
              el.style.textShadow = 'none';
            });
          } else {
            nav.style.background = 'transparent';
            nav.style.boxShadow = 'none';
            if (brandStrong) brandStrong.style.color = '#ffffff';
            navLinks.forEach(function(el) {
              el.style.color = '#ffffff';
              el.style.textShadow = '0 1px 4px rgba(0,0,0,0.3)';
            });
          }
        }

        // 初始执行
        updateNavbar();

        // 监听滚动
        window.addEventListener('scroll', updateNavbar);
      }
    })();
  </script>
