            });
          }
        }

        updateNavbar();
        window.addEventListener('scroll', updateNavbar);

      { title: "春天花会开", artist: "任贤齐", url: "/music/春天花会开-任贤齐.mp3" },
      { title: "红豆", artist: "王菲", url: "/music/红豆-王菲.mp3" },

      { title: "平安夜", artist: "山下达郎", url: "/music/平安夜-山下达郎.mp3" },
      { title: "沙滩", artist: "陶喆", url: "/music/沙滩-陶喆.mp3" },
      { title: "四季ノ唄", artist: "unknown", url: "/music/四季ノ唄-unknow.mp3" },
      { title: "太聪明", artist: "陈绮贞", url: "/music/太聪明-陈绮贞.mp3" },
      { title: "突然的自我", artist: "伍佰", url: "/music/突然的自我-伍佰.mp3" }
    ];

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatTime(seconds) {
      if (!isFinite(seconds)) { return '0:00'; }
      var m = Math.floor(seconds / 60);
      var s = Math.floor(seconds % 60);
      return m + ':' + (s < 10 ? '0' + s : s);
    }

    /* ===== 侧栏切换 ===== */
    var dock = document.getElementById('side-dock');
    var tabs = document.querySelectorAll('.side-tab');
    var views = {
      search: document.getElementById('view-search'),
      player: document.getElementById('view-player'),
      links: document.getElementById('view-links')
    };

    function setActivePanel(name) {
      Object.keys(views).forEach(function (key) {
        views[key].hidden = key !== name;
      });
      tabs.forEach(function (tab) {
        tab.classList.toggle('active', tab.getAttribute('data-panel') === name);
      });
      var sideTabs = document.getElementById('side-tabs');
      var searchTab = document.querySelector('.side-tab[data-panel="search"]');
      if (sideTabs) {
        sideTabs.classList.toggle('search-active', !!(searchTab && searchTab.classList.contains('active')));
      }
      if (name === 'search') {
        loadSearchData();
      }
    }

    function syncBodyShift() {
      document.body.classList.toggle('side-open', dock.classList.contains('open'));
    }

    function openPanel(name) {
      setActivePanel(name);
      dock.classList.add('open');
      syncBodyShift();
      if (name === 'player') {
        if (currentIndex < 0) {
          play(0);
        } else if (audio.paused) {
          audio.play();
          updatePlayButton();
        }
      }
    }

    function closePanel() {
      dock.classList.remove('open');
      syncBodyShift();
    }

    tabs.forEach(function (tab) {
      tab.addEventListener('mouseenter', function () {
        setActivePanel(tab.getAttribute('data-panel'));
      });
      tab.addEventListener('click', function () {
        openPanel(tab.getAttribute('data-panel'));
      });
    });

    var collapseButton = document.getElementById('side-collapse');
    if (collapseButton) {
      collapseButton.addEventListener('click', closePanel);
    }

    /* ===== 搜索 ===== */
    var searchData = null;
    var searchLoaded = false;
    var searchInput = document.getElementById('side-search-input');
    var searchResult = document.getElementById('side-search-result');

    function loadSearchData() {
      if (searchLoaded) { return; }
      fetch('/search.json', { credentials: 'same-origin' }).then(function (response) {
        if (!response.ok) { throw new Error('search index failed'); }
        return response.json();
      }).then(function (data) {
        searchData = data || [];
        searchLoaded = true;
      }).catch(function () {
        searchLoaded = true;
        searchData = [];
      });
    }

    function makeExcerpt(content, query) {
      var plain = String(content || '').replace(/\s+/g, ' ').trim();
      var idx = plain.toLowerCase().indexOf(query.toLowerCase());
      if (idx < 0) { return plain.slice(0, 60); }
      var start = Math.max(0, idx - 16);
      var end = Math.min(plain.length, idx + query.length + 48);
      var prefix = start > 0 ? '…' : '';
      return prefix + plain.slice(start, end);
    }

    function runSearch() {
      var query = searchInput.value.trim();
      if (!searchLoaded) { loadSearchData(); }
      if (!query) {
        searchResult.innerHTML = '<div class="search-empty">输入关键词开始搜索</div>';
        return;
      }
      if (!searchData || searchData.length === 0) {
        searchResult.innerHTML = '<div class="search-empty">正在准备搜索数据…</div>';
        return;
      }

      var lower = query.toLowerCase();
      var html = '';
      searchData.forEach(function (item) {
        var title = item.title || '';
        var content = item.content || '';
        if (title.toLowerCase().indexOf(lower) === -1 && content.toLowerCase().indexOf(lower) === -1) {
          return;
        }
        html += '<a class="search-result" href="' + escapeHtml(item.url) + '">'
          + '<span class="search-result-title">' + escapeHtml(title) + '</span>'
          + '<span class="search-result-excerpt">' + escapeHtml(makeExcerpt(content, query)) + '</span>'
          + '</a>';
      });

      searchResult.innerHTML = html || '<div class="search-empty">没有找到相关文章</div>';
    }

    searchInput.addEventListener('input', runSearch);

    /* ===== 播放器 ===== */
    var audio = new Audio();
    var currentIndex = -1;
    var mode = 'list';
    var songList = document.getElementById('song-list');
    var playerTitle = document.getElementById('player-title');
    var playerArtist = document.getElementById('player-artist');
    var btnPlay = document.getElementById('btn-play');
    var btnPrev = document.getElementById('btn-prev');
    var btnNext = document.getElementById('btn-next');
    var progressFill = document.getElementById('player-progress-fill');
    var progressTrack = document.querySelector('.player-progress-track');
    var currentTimeEl = document.getElementById('player-current');
    var durationEl = document.getElementById('player-duration');
    var modeButtons = document.querySelectorAll('.mode-btn');

    function renderSongs() {
      songList.innerHTML = '';
      tracks.forEach(function (track, index) {
        var item = document.createElement('button');
        item.type = 'button';
        item.className = 'song-item';
        item.innerHTML = '<span class="song-title">' + escapeHtml(track.title) + '</span>'
          + '<span class="song-artist">' + escapeHtml(track.artist) + '</span>';
        item.addEventListener('click', function () {
          play(index);
        });
        songList.appendChild(item);
      });
    }

    function updateSongHighlight() {
      var items = songList.querySelectorAll('.song-item');
      items.forEach(function (item, index) {
        item.classList.toggle('playing', index === currentIndex);
      });
    }

    function updateNowPlaying() {
      if (currentIndex < 0) { return; }
      playerTitle.textContent = tracks[currentIndex].title;
      playerArtist.textContent = tracks[currentIndex].artist;
    }

    function updatePlayButton() {
      var playIcon = btnPlay.querySelector('.icon-play');
      var pauseIcon = btnPlay.querySelector('.icon-pause');
      if (playIcon) { playIcon.style.display = audio.paused ? 'block' : 'none'; }
      if (pauseIcon) { pauseIcon.style.display = audio.paused ? 'none' : 'block'; }
    }

    function play(index) {
      if (index < 0 || index >= tracks.length) { return; }
      if (index === currentIndex) {
        if (audio.paused) {
          audio.play();
        } else {
          audio.pause();
        }
        updatePlayButton();
        return;
      }
      currentIndex = index;
      audio.src = tracks[index].url;
      audio.play();
      updateNowPlaying();
      updatePlayButton();
      updateSongHighlight();
    }

    function prev() {
      if (tracks.length === 0) { return; }
      play(currentIndex <= 0 ? tracks.length - 1 : currentIndex - 1);
    }

    function next() {
      if (tracks.length === 0) { return; }
      play(currentIndex < 0 ? 0 : (currentIndex + 1) % tracks.length);
    }

    function shuffleNext() {
      if (tracks.length <= 1) { play(0); return; }
      var randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * tracks.length);
      } while (randomIndex === currentIndex);
      play(randomIndex);
    }

    function setMode(nextMode) {
      mode = nextMode;
      audio.loop = mode === 'single';
      modeButtons.forEach(function (button) {
        button.classList.toggle('active', button.getAttribute('data-mode') === mode);
      });
    }

    btnPlay.addEventListener('click', function () {
      if (currentIndex < 0) { play(0); return; }
      if (audio.paused) { audio.play(); } else { audio.pause(); }
      updatePlayButton();
    });
    btnPrev.addEventListener('click', prev);
    btnNext.addEventListener('click', next);
    modeButtons.forEach(function (button) {
      button.addEventListener('click', function () {
        setMode(button.getAttribute('data-mode'));
      });
    });

    audio.addEventListener('ended', function () {
      if (mode === 'single') {
        audio.currentTime = 0;
        audio.play();
      } else if (mode === 'shuffle') {
        shuffleNext();
      } else {
        next();
      }
    });

    audio.addEventListener('timeupdate', function () {
      if (!isFinite(audio.duration)) { return; }
      var percent = audio.duration > 0 ? (audio.currentTime / audio.duration) * 100 : 0;
      progressFill.style.width = percent + '%';
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', function () {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('play', updatePlayButton);
    audio.addEventListener('pause', updatePlayButton);

    progressTrack.addEventListener('click', function (event) {
      if (!isFinite(audio.duration)) { return; }
      var rect = progressTrack.getBoundingClientRect();
      var ratio = (event.clientX - rect.left) / rect.width;
      audio.currentTime = Math.max(0, Math.min(1, ratio)) * audio.duration;
    });

    renderSongs();
    setMode('list');

    /* ===== 初始化：桌面展开、移动端收起 ===== */
    setActivePanel('search');
    if (window.innerWidth <= 768) {
      closePanel();
    } else {
      dock.classList.add('open');
      syncBodyShift();
    }
  })();
</script>
